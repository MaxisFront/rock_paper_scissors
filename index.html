<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock, Paper and Scissors!</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="js/main.js" defer></script>
  </head>

  <body>

    <div class="header">
      <div class="header__title">
        <p>Rock, paper and Scissors!</p>
      </div>
      <div class="header__text">
        <p>You need to select one of the 3 available options! Beat that clanker!</p>
      </div>
    </div>

    <div class="rps">
      
      <div class="rps__computer-answer">
        <p data-answer="computer"></p>
      </div>

      <div class="rps__user-answer">
        <p data-answer="player"></p>
      </div>

      <div class="rps__options">
        <button class="bttn_option bttn_rock" id="rock">ROCK</button>
        <button class="bttn_option bttn_paper" id="paper">PAPER</button>
        <button class="bttn_option bttn_scissors" id="scissors">SCISSORS</button>
      </div>

    </div>

  </body>
</html>
